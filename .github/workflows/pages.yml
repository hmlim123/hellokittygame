name: Publish Hello Kitty game

on:
  push:
    branches: [master]
    paths:
      - "dist/**"
      - "src/**"
      - "scripts/prepare-assets.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "adventure.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the game
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check game rules and save migration
        run: npm test
      - name: Build the React game
        run: npm run build
      - name: Check playable assets
        run: |
          test -s build/index.html
          test -s build/adventure.html
          test -s build/assets/hello-kitty.glb
          test -s build/classic/index.html
      - name: Install pinned browser checks
        run: |
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install -r tests/browser-requirements.txt
          .venv-browser/bin/python -m playwright install --with-deps chromium
      - name: Play the complete release journeys
        run: .venv-browser/bin/python tests/run-browser-checks.py
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-check-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the playable website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
