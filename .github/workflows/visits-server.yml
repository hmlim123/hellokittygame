name: Check private village visits
on:
  push:
    branches: [master]
    paths: ['server/**', 'shared/**', 'render.yaml', '.github/workflows/visits-server.yml']
  pull_request:
    paths: ['server/**', 'shared/**', 'render.yaml', '.github/workflows/visits-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visits:
    name: Check two-player sessions and shared actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server test
