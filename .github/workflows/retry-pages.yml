name: Republish a tested game build

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed Pages workflow run whose build and all browser groups passed
        required: true
        type: string
      source_commit:
        description: Full source commit SHA from that run
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Republish the exact tested artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Require the successful build and all browser groups
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, json
          from urllib.request import Request, urlopen
          run, commit, repo = (os.environ[n] for n in ['SOURCE_RUN','SOURCE_COMMIT','REPOSITORY'])
          assert re.fullmatch(r'[0-9]+', run) and re.fullmatch(r'[0-9a-f]{40}', commit)
          def get(path):
              request = Request('https://api.github.com/repos/'+repo+'/'+path, headers={
                  'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(request, timeout=30) as response: return json.load(response)
          source = get('actions/runs/'+run)
          assert source['status']=='completed' and source['head_sha']==commit
          assert source['head_branch']=='master' and source['event']=='push'
          assert source['head_repository']['full_name']==repo
          assert source['path'].split('@')[0]=='.github/workflows/pages.yml'
          jobs = get('actions/runs/'+run+'/jobs?filter=latest&per_page=100')['jobs']
          required = ['Build and check game rules']+['Browser journeys '+str(i) for i in range(5)]
          for name in required:
              matching = [job for job in jobs if job['name']==name]
              assert len(matching)==1 and matching[0]['conclusion']=='success', name+' has not passed'
          assert all(job['conclusion']=='success' for job in jobs if job['name']!='Publish the tested game'), 'A non-publication job did not pass'
          artifacts = get('actions/runs/'+run+'/artifacts')['artifacts']
          matching = [a for a in artifacts if a['name']=='tested-site' and not a['expired']]
          assert len(matching)==1, 'Exact tested artifact is missing or expired'
          print('Verified source', commit, 'and all six required build/browser jobs in run', run)
          PY
      - name: Download the exact tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-site
          path: build
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify the downloaded release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('build');commit=os.environ['SOURCE_COMMIT']
          assert all((root/name).is_file() for name in ['index.html','adventure.html','assets/hello-kitty.glb','classic/index.html'])
          assert any(commit[:7].encode() in p.read_bytes() for p in (root/'assets').glob('*.js'))
          meta=json.loads((root/'assets/kitty-source.json').read_text())
          assert {'dance','wave','offer'}.issubset(meta['clips'])
          print('Verified immutable game release', commit)
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the playable website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          timeout: 1200000
