# Review the plan in Render before deploying. Durable login storage requires a
# paid persistent disk; this blueprint does not deploy or incur charges itself.
services:
  - type: web
    name: nancy-village-visits
    runtime: node
    plan: starter
    buildCommand: npm --prefix server ci
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - shared/**
        - render.yaml
    disk:
      name: private-village-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: https://hmlim123.github.io
      - key: PRIVATE_ACCOUNTS
        value: "true"
      - key: ACCOUNT_SETUP_KEY
        generateValue: true
      - key: ACCOUNT_STORE_FILE
        value: /var/data/accounts.json
      - key: VISIT_STORE_FILE
        value: /var/data/visits.json
